<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#050208" />
<title>💗 Page Not Found — Our Anniversary</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600&family=Great+Vibes&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(120% 100% at 50% 0%, #150a2e 0%, #050208 60%);
    color: #e9e2ff; text-align: center; padding: 24px;
    font-family: "Cormorant Garamond", Georgia, serif;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .stars i {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #fff; opacity: .6; animation: tw 4s ease-in-out infinite;
  }
  @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  .box { position: relative; max-width: 520px; }
  .mark { font-size: 64px; line-height: 1; animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  h1 {
    font-family: "Great Vibes", cursive; font-weight: 400;
    font-size: clamp(2.4rem, 9vw, 3.6rem); margin: 8px 0 6px;
    background: linear-gradient(100deg, #b07bff, #ff6fa5, #ffd6e7);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { font-size: 1.15rem; opacity: .8; margin: 0 0 26px; }
  a.btn {
    display: inline-block; text-decoration: none; color: #fff;
    padding: 14px 30px; border-radius: 999px;
    background: linear-gradient(100deg, #7c3aed, #ec4899);
    box-shadow: 0 0 28px rgba(176,123,255,.45);
    font-family: "Montserrat", system-ui, sans-serif; font-size: .95rem; letter-spacing: .06em;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  a.btn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(255,111,165,.6); }
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="box">
  <div class="mark">💗</div>
  <h1>Page Not Found</h1>
  <p>Page-kan ma jiro... mise aad si kale u u baahan tahay?</p>
  <a class="btn" href="/">↩ Back to Our Anniversary</a>
</div>
<script>
  (function () {
    const box = document.getElementById('stars');
    for (let i = 0; i < 90; i++) {
      const s = document.createElement('i');
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
      s.style.transform = 'scale(' + (0.6 + Math.random() * 1.8) + ')';
      box.appendChild(s);
    }
  })();
</script>
</body>
</html>
